<!DOCTYPE html>
<html lang="en">
	<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none';">
		<meta charset="UTF-8">

		<meta property="og:title" content="Emulatrix">
		<meta property="og:url" content="https://www.emulatrix.com">
		<meta property="og:description" content="Play Retro Games Online">
		<meta property="og:image" content="https://www.emulatrix.com/assets/images/EmulatrixShare.png">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="Emulatrix">
		<meta name="theme-color" content="#000000">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="description" content="JavaScript and WebAssembly Emulator. Sega Genesis, Nintendo, Super Nintendo, GameBoy, GameBoy Color, GameBoy Advance, MAME32, DOSBox and Virtual Machines.">
		<meta name="keywords" content="emulator, abandonware, games, sega, genesis, nintendo, super, gameboy, color, advance, mame, mame32, arcade, dos, dosbox, javascript, emscripten, online, free, open, source">
		<link rel="manifest" href="assets/data/Emulatrix.json">
		<link rel="icon" sizes="16x16" type="image/svg+xml" href="assets/images/EmulatrixFavIcon.svg">
		<link rel="icon" sizes="192x192" type="image/svg+xml" href="assets/images/EmulatrixFavIcon.svg">
		<link rel="apple-touch-icon" href="assets/images/EmulatrixIcon.png">
		<link rel="apple-touch-startup-image" href="assets/images/EmulatrixIcon.png">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="assets/css/Emulayshun.css">
	</head>
	<body>
		<iframe id="content" src="about:blank"></iframe>
		<script>

			function resizeContent()
				{
				// GETTING THE WINDOW WIDTH
				var w = window.innerWidth;

				// GETTING THE WINDOW HEIGHT
				var h = window.innerHeight;

				// CHECKING IF THE CURRENT DEVICE IS A MOBILE DEVICE
				if(window.innerHeight > window.innerWidth)
					{
					// RESIZING THE CONTAINER FOR MOBILE DEVICES
					document.getElementById("content").style.width = h + "px";
					document.getElementById("content").style.height = w + "px";
					}
					else
					{
					// RESIZING THE CONTAINER FOR DESKTOP DEVICES
					document.getElementById("content").style.width = w + "px";
					document.getElementById("content").style.height = h + "px";
					}
				}

			window.addEventListener("load", function()
				{
				// CHECKING IF EMULATRIX IS NOT RUNNING WITHIN AN IFRAME
				if (window.top == window.self)
					{
					// RESIZING THE IFRAME
					resizeContent();

					// CREATING A 250 MS INTERVAL
					setInterval(function()
						{
						// FOCUSING THE CONTAINER
						document.getElementById("content").focus();
						}, 250);

					// LOADING THE EMULATRIX MENU
					document.getElementById("content").src = "pages/Emulatrix.html";

					// SHOWING THE IFRAME
					document.getElementById("content").style.display = "block";
					}
				});

			window.addEventListener("resize", function()
				{
				// RESIZING THE IFRAME WHEN THE SCREEN SIZE CHANGES
				resizeContent();
				});

			var supportsOrientationChange = "onorientationchange" in window, orientationEvent = supportsOrientationChange ? "orientationchange" : "resize";
			window.addEventListener(orientationEvent, function()
				{
				// RESIZING THE IFRAME WHEN THE SCREEN ORIENTATION CHANGES
				resizeContent();
				}, false);

			function updateTitle()
				{
				document.title = "Emulatrix";
				}

			if ("serviceWorker" in navigator)
				{
				navigator.serviceWorker.register("worker.js").then(function(registration)
					{
					// Registration successful
					//console.log("ServiceWorker registration successful with scope: " + registration.scope);
					}).catch(function(err)
					{
					// Registration failed
					//console.log("ServiceWorker registration failed: " + err);
					});
				}
		</script>
	</body>
</html>
